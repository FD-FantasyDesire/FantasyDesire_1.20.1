<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超新星 · 汇聚与爆发</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#dce7f5;background:#0c1019}
*{box-sizing:border-box}body{margin:0}header{height:76px;padding:20px 28px;border-bottom:1px solid #253043;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0;font-weight:550;letter-spacing:2px}header p{margin:6px 0 0;color:#8291a9;font-size:12px}.badge{font-size:11px;color:#b6d7ef;border:1px solid #31465d;border-radius:20px;padding:7px 12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 288px;height:calc(100vh - 76px)}.stage{min-width:0;display:flex;flex-direction:column}.viewport{position:relative;flex:1;min-height:260px;overflow:hidden;background:#080a12}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}.stage-note{position:absolute;top:20px;left:24px;pointer-events:none;font-size:11px;letter-spacing:1px;color:#7d8da4}.phase{color:#c8d8ea;font-size:14px;display:block;margin-bottom:6px}.telemetry{position:absolute;right:20px;bottom:16px;color:#7d8da4;font:11px monospace;pointer-events:none}.transport{padding:17px 23px;background:#101622;border-top:1px solid #253043}.time-row{display:flex;gap:12px;align-items:center}#timeline{flex:1}output{font:12px monospace;white-space:nowrap;color:#b9c8dd}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
aside{padding:24px 20px;border-left:1px solid #253043;background:#10151f;overflow:auto}h2{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#8fa0b8;font-weight:500;margin:0 0 16px}.group{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid #263043}label{font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:13px 0}input[type=range]{accent-color:#8bb7d9;min-width:0}aside input[type=range]{width:133px}button,select,input[type=number]{background:#192231;color:#c8d8ea;border:1px solid #34435a;border-radius:5px;font:12px inherit;padding:7px 10px}button{cursor:pointer;font-size:12px}button:hover{background:#27374d;border-color:#6c8eae}button.primary{background:#c0ddeb;color:#152533;border:0}input[type=number]{width:95px}select{max-width:158px;font-size:12px}small{display:block;line-height:1.8;font-size:11px;color:#8291a9}.wide{width:100%;margin-top:8px}.status{font-size:11px;color:#a5cbb4;white-space:pre-wrap;line-height:1.7}#error{position:absolute;inset:50px 20px auto;background:#321d2b;color:#ffc6c6;padding:20px;white-space:pre-wrap;font:12px monospace;max-height:70%;overflow:auto}#error[hidden]{display:none}a{color:#adcde3}#file{width:100%;font-size:11px;margin:10px 0}.shortcuts{margin-top:14px;color:#65778e;font-size:11px}@media(max-width:760px){main{grid-template-columns:1fr;height:auto}.viewport{height:65vh;flex:none}aside{border-left:0;border-top:1px solid #253043;display:grid;grid-template-columns:1fr 1fr;gap:18px}.group{margin:0}header{padding:16px}.badge{display:none}}
</style>
<header><div><h1>超新星 / CONVERGENCE</h1><p>七对星光汇入旋转的星核，倒计时结束释放星云。</p></div><span class="badge">空间效果预制 · 02</span></header>
<main>
<section class="stage">
  <div class="viewport"><canvas id="canvas" aria-label="超新星三维预览"></canvas><div class="stage-note"><span class="phase" id="phase">正在加载</span>拖动画面，环绕观察</div><div class="telemetry" id="telemetry"></div><pre id="error" hidden></pre></div>
  <div class="transport"><div class="time-row"><input id="timeline" type="range" min="0" max="6.399" step="0.001" value="0" aria-label="时间轴"><output id="time">0.000 / 6.400 s</output></div>
    <div class="buttons"><button id="play" class="primary">暂停</button><button id="restart">重播</button><button id="back">前一帧</button><button id="next">后一帧</button><button data-event="gather">汇聚</button><button data-event="before">爆炸前一帧</button><button data-event="impact">爆炸时刻</button><button data-event="cloud">星云展开</button><button data-event="fade">消散</button></div>
    <div class="shortcuts">空格 播放 / 暂停 · ← → 逐帧（1/60 秒） · 双击画面 重置视角</div>
  </div>
</section>
<aside>
  <div class="group"><h2>时间与形态</h2><label>播放速度<select id="speed"><option value="0.25">0.25 × 慢放</option><option value="0.5">0.5 ×</option><option value="1" selected>1 × 审查节奏</option><option value="gif">≈ GIF 原速</option></select></label><label>爆炸倒计时（秒）<input id="explosion" type="number" min="0.5" max="12" step="0.1" value="2.8"></label><label>随机种子<input id="seed" type="number" min="0" max="9999" step="1" value="17"></label><button class="wide" id="random">换一组形态</button><small id="arrival"></small><small>粒子按倒计时安排抵达。切换种子改变轨道和云团，爆炸时刻保持所设值。</small></div>
  <div class="group"><h2>空间与显示</h2><label>水平视角<input id="yaw" type="range" min="-180" max="180" step="1" value="17"></label><label>俯仰视角<input id="pitch" type="range" min="-75" max="75" step="1" value="10"></label><label>参考网格<input id="grid" type="checkbox"></label><label>背景<select id="background"><option value="0">深空</option><option value="1">灰蓝</option></select></label><label>曝光<input id="exposure" type="range" min="0.5" max="2.5" step="0.05" value="1.35"></label><label>预览精度<select id="quality"><option value="draft">草稿 · 32 步</option><option value="review" selected>审查 · 56 步</option><option value="high">精细 · 80 步</option></select></label></div>
  <div class="group"><h2>审查工具</h2><button class="wide" id="reload">重新载入着色器</button><button class="wide" id="capture">保存当前帧 PNG</button><button class="wide" id="copy">复制当前审查链接</button><small>保存 main.frag 后点“重新载入”。也可直接选择本地文件：</small><input id="file" type="file" accept=".frag,.glsl,text/plain"><small><a href="../%E8%B6%85%E6%96%B0%E6%98%9F%E7%88%86%E7%82%B8%E5%8F%82%E8%80%83%E5%9B%BE.gif" target="_blank" rel="noopener">查看 GIF 参考</a> · <a href="README.md" target="_blank">原型说明</a></small></div>
  <div><h2>运行状态</h2><div id="status" class="status" role="status">准备 WebGL 1…</div></div>
</aside>
</main>
<script src="preview.js"></script>
</html>
